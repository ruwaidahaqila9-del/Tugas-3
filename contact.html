 <section id="contact" class="page-section">
            <div class="section-header">
                <h2>Get In Touch</h2>
                <p>Send a message, collaboration request, or question</p>
            </div>

            <div class="contact-wrapper">
                <form class="contact-form" id="portfolio-form" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label for="sender-name"><i class="fa-solid fa-user"></i> Your Name</label>
                        <input type="text" id="sender-name" class="form-control" placeholder="Enter your full name..." required>
                    </div>

                    <div class="form-group">
                        <label for="sender-email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                        <input type="email" id="sender-email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message-category"><i class="fa-solid fa-list"></i> Message Category</label>
                        <select id="message-category" class="form-control" required>
                            <option value="">Select a category...</option>
                            <option value="Question">Question</option>
                            <option value="Collaboration">Collaboration</option>
                            <option value="Feedback">Feedback / Suggestions</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message-text"><i class="fa-solid fa-comment-dots"></i> Message</label>
                        <textarea id="message-text" class="form-control" placeholder="Type your message here..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                        <i class="fa-solid fa-paper-plane"></i> Send Message
                    </button>
                </form>

                <div class="contact-info-card">
                    <h3 style="font-size: 2rem; margin-bottom: 25px;">Contact Info</h3>

                    <div class="info-item">
                        <i class="fa-solid fa-school"></i>
                        <div>
                            <h5>School Address</h5>
                            <p>SMAN 2 Mojokerto, East Java</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-envelope-open-text"></i>
                        <div>
                            <h5>Email</h5>
                            <p>kila.student@sman2mojokerto.sch.id</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <h5>City</h5>
                            <p>Mojokerto City, Indonesia</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- DYNAMIC SUB-PAGE MODAL DRAWER -->
        <div class="modal-overlay" id="subpage-modal">
            <div class="subpage-container" id="subpage-content">
                <button class="close-modal-btn" onclick="closeSubPage()"><i class="fa-solid fa-xmark"></i></button>
                <div id="modal-dynamic-body">
                    <!-- Dynamic Content populated via JavaScript -->
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-socials">
                <a href="https://github.com" target="_blank" class="social-link"><i class="fa-brands fa-github"></i></a>
                <a href="https://instagram.com" target="_blank" class="social-link"><i class="fa-brands fa-instagram"></i></a>
                <a href="mailto:kila@example.com" class="social-link"><i class="fa-solid fa-envelope"></i></a>
            </div>
            <p class="footer-text">
                © 2026 Kila • Class XII-6 SMAN 2 Mojokerto. Crafted with <i class="fa-solid fa-heart" style="color: var(--pink-dark);"></i> & Pink-White Lily Flowers.
            </p>
        </footer>
    </div>

    <script>
        // Tab Navigation Function
        function switchTab(tabId) {
            const sections = document.querySelectorAll('.page-section');
            const navButtons = document.querySelectorAll('.nav-btn');

            sections.forEach(sec => sec.classList.remove('active'));
            navButtons.forEach(btn => btn.classList.remove('active'));

            const targetSection = document.getElementById(tabId);
            if (targetSection) {
                targetSection.classList.add('active');
            }

            navButtons.forEach(btn => {
                if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(tabId)) {
                    btn.classList.add('active');
                }
            });

            document.getElementById('nav-links').classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Mobile Menu Toggle Functionality
        const mobileToggle = document.getElementById('mobile-toggle');
        const navLinks = document.getElementById('nav-links');

        mobileToggle.addEventListener('click', () => {
            navLinks.classList.toggle('show');
        });

        // Contact Form Submission Handler
        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('sender-name').value;
            
            const msgBox = document.createElement('div');
            msgBox.style.cssText = `
                position: fixed; top: 20px; right: 20px; background: #fff0f5;
                border: 3px solid #ff9fc5; color: #e85d91; padding: 18px 24px;
                border-radius: 20px; font-weight: bold; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
                z-index: 9999; animation: fadeIn 0.3s ease-in-out;
            `;
            msgBox.innerHTML = `✨ Thank you so much, ${name}! Your message has been sent successfully. 💕`;
            document.body.appendChild(msgBox);

            setTimeout(() => {
                msgBox.remove();
            }, 4000);

            document.getElementById('portfolio-form').reset();
        }

        const subpageModal = document.getElementById('subpage-modal');
        const modalBody = document.getElementById('modal-dynamic-body');

        function openSubPage(pageKey) {
            let htmlContent = '';

            if (pageKey === 'ip-subnetting') {
                htmlContent = `
                    <span class="subpage-badge">Networking Module • Page 1</span>
                    <h2 class="subpage-title">IP Addressing & Subnetting</h2>
                    <p>Subnetting breaks large IPv4 s into smaller, manageable subnets to reduce network congestion and optimize routing performance.</p>

                    <div class="interactive-tool-box">
                        <h4 style="margin-bottom: 12px; color: var(--pink-dark);"><i class="fa-solid fa-calculator"></i> Interactive Subnet Calculator</h4>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                            <input type="text" id="calc-ip" class="form-control" value="192.168.1.10" style="flex: 2; min-width: 160px;" placeholder="e.g. 192.168.1.1">
                            <select id="calc-prefix" class="form-control" style="flex: 1; min-width: 120px;">
                                <option value="24">/24 (255.255.255.0)</option>
                                <option value="25">/25 (255.255.255.128)</option>
                                <option value="26">/26 (255.255.255.192)</option>
                                <option value="27">/27 (255.255.255.224)</option>
                                <option value="28">/28 (255.255.255.240)</option>
                            </select>
                            <button class="btn btn-primary" onclick="calculateSubnet()"><i class="fa-solid fa-play"></i> Calculate</button>
                        </div>
                        <div id="calc-results" style="background: var(--pink-soft); padding: 15px; border-radius: 12px; border: 1px border-color: var(--pink); font-size: 0.95rem;">
                            <strong>Network Address:</strong> 192.168.1.0<br>
                            <strong>Subnet Mask:</strong> 255.255.255.0<br>
                            <strong>Usable Hosts:</strong> 254 IPs (192.168.1.1 - 192.168.1.254)<br>
                            <strong>Broadcast Address:</strong> 192.168.1.255
                        </div>
                    </div>

                    <h4 style="margin-top: 20px;">Class XII Curriculum Learning Notes:</h4>
                    <ul style="padding-left: 20px; margin-top: 8px;">
                        <li><strong>Class A:</strong> 1.0.0.0 to 126.255.255.255 (Default Mask /8)</li>
                        <li><strong>Class B:</strong> 128.0.0.0 to 191.255.255.255 (Default Mask /16)</li>
                        <li><strong>Class C:</strong> 192.0.0.0 to 223.255.255.255 (Default Mask /24)</li>
                    </ul>
                `;
            } else if (pageKey === 'packet-tracer') {
                htmlContent = `
                    <span class="subpage-badge">Networking Module • Page 2</span>
                    <h2 class="subpage-title">Packet Tracer Network Simulator</h2>
                    <p>Visualizing network communication between PCs and Switches in SMAN 2 Mojokerto's computer lab simulation.</p>

                    <div class="interactive-tool-box" style="text-align: center;">
                        <h4 style="margin-bottom: 15px;"><i class="fa-solid fa-circle-nodes"></i> Interactive Topology Tester</h4>
                        <div style="display: flex; justify-content: space-around; align-items: center; margin: 20px 0;">
                            <div style="background: var(--pink-light); padding: 15px; border-radius: 15px; border: 2px solid var(--pink);">
                                <i class="fa-solid fa-desktop" style="font-size: 2rem; color: var(--pink-dark);"></i>
                                <p><strong>PC-01</strong><br>192.168.1.2</p>
                            </div>
                            <div id="ping-line" style="height: 4px; width: 80px; background: #ccc; transition: background 0.3s;"></div>
                            <div style="background: var(--pink-dark); color: white; padding: 15px; border-radius: 50%;">
                                <i class="fa-solid fa-server" style="font-size: 2rem;"></i>
                                <p style="font-size: 0.8rem;">Switch</p>
                            </div>
                            <div id="ping-line-2" style="height: 4px; width: 80px; background: #ccc; transition: background 0.3s;"></div>
                            <div style="background: var(--pink-light); padding: 15px; border-radius: 15px; border: 2px solid var(--pink);">
                                <i class="fa-solid fa-desktop" style="font-size: 2rem; color: var(--pink-dark);"></i>
                                <p><strong>PC-02</strong><br>192.168.1.3</p>
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="simulatePing()"><i class="fa-solid fa-paper-plane"></i> Send Ping Packet</button>
                        <p id="ping-status" style="margin-top: 12px; font-weight: bold; color: var(--pink-dark);">Click button to send ICMP Echo Request</p>
                    </div>
                `;
            } else if (pageKey === 'dht11-sensor') {
                htmlContent = `
                    <span class="subpage-badge">IoT Hardware • Page 1</span>
                    <h2 class="subpage-title">DHT11 Sensor & I2C LCD Display</h2>
                    <p>Reading ambient environmental conditions and publishing live readings onto a liquid crystal display.</p>

                    <div class="interactive-tool-box">
                        <h4 style="margin-bottom: 10px;"><i class="fa-solid fa-gauge-high"></i> Live Temperature Gauge Simulator</h4>
                        <label>Adjust Simulated Temperature (°C):</label>
                        <input type="range" id="temp-slider" min="15" max="45" value="28" style="width: 100%; margin: 10px 0;" oninput="updateTempGauge(this.value)">
                        <div style="background: #111; color: #00ff66; font-family: monospace; padding: 18px; border-radius: 12px; font-size: 1.1rem; text-align: center; border: 3px solid var(--pink);">
                            [ LCD 16x2 Display ]<br>
                            Temp: <span id="temp-val">28</span>°C | Humidity: <span id="hum-val">65</span>%<br>
                            Status: <span id="temp-status">NORMAL ROOM TEMP</span>
                        </div>
                    </div>
                `;
            } else if (pageKey === 'servo-motor') {
                htmlContent = `
                    <span class="subpage-badge">IoT Actuators • Page 2</span>
                    <h2 class="subpage-title">Servo Motor Actuator Controller</h2>
                    <p>PWM pulse width modulation enables exact mechanical rotation angle positioning (0° to 180°).</p>

                    <div class="interactive-tool-box" style="text-align: center;">
                        <h4 style="margin-bottom: 15px;"><i class="fa-solid fa-compass"></i> Servo Arm Rotation Visualizer</h4>
                        <div style="width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--pink-dark); margin: 0 auto 15px; position: relative; background: var(--pink-light);">
                            <div id="servo-arm" style="width: 4px; height: 60px; background: var(--pink-dark); position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; transform: rotate(0deg); transition: transform 0.2s ease;"></div>
                        </div>
                        <label>Set Angle Angle (0° - 180°):</label>
                        <input type="range" min="0" max="180" value="0" style="width: 80%; margin: 10px 0;" oninput="rotateServo(this.value)">
                        <p>Current Angle: <strong id="servo-angle-text" style="font-size: 1.3rem; color: var(--pink-dark);">0°</strong></p>
                    </div>
                `;
            } else if (pageKey === 'project-calculator') {
                htmlContent = `
                    <span class="subpage-badge">Project Showcase • Live App</span>
                    <h2 class="subpage-title">Scientific Calculator App</h2>
                    
                    <div class="interactive-tool-box" style="max-width: 320px; margin: 0 auto;">
                        <input type="text" id="calc-screen" class="form-control" style="text-align: right; font-size: 1.5rem; margin-bottom: 15px;" readonly value="0">
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
                            <button class="btn btn-secondary" onclick="calcBtn('C')">C</button>
                            <button class="btn btn-secondary" onclick="calcBtn('(')">(</button>
                            <button class="btn btn-secondary" onclick="calcBtn(')')">)</button>
                            <button class="btn btn-primary" onclick="calcBtn('/')">/</button>
                            
                            <button class="btn btn-secondary" onclick="calcBtn('7')">7</button>
                            <button class="btn btn-secondary" onclick="calcBtn('8')">8</button>
                            <button class="btn btn-secondary" onclick="calcBtn('9')">9</button>
                            <button class="btn btn-primary" onclick="calcBtn('*')">*</button>
                            
                            <button class="btn btn-secondary" onclick="calcBtn('4')">4</button>
                            <button class="btn btn-secondary" onclick="calcBtn('5')">5</button>
                            <button class="btn btn-secondary" onclick="calcBtn('6')">6</button>
                            <button class="btn btn-primary" onclick="calcBtn('-')">-</button>
                            
                            <button class="btn btn-secondary" onclick="calcBtn('1')">1</button>
                            <button class="btn btn-secondary" onclick="calcBtn('2')">2</button>
                            <button class="btn btn-secondary" onclick="calcBtn('3')">3</button>
                            <button class="btn btn-primary" onclick="calcBtn('+')">+</button>
                            
                            <button class="btn btn-secondary" onclick="calcBtn('0')">0</button>
                            <button class="btn btn-secondary" onclick="calcBtn('.')">.</button>
                            <button class="btn btn-primary" style="grid-column: span 2;" onclick="calcBtn('=')">=</button>
                        </div>
                    </div>
                `;
            } else {
                htmlContent = `
                    <span class="subpage-badge">Detailed Module View</span>
                    <h2 class="subpage-title">Module Overview</h2>
                    <p>This is a dedicated sub-page worksheet for Grade XII IPA Informatika curriculum at SMAN 2 Mojokerto.</p>
                    <div class="interactive-tool-box">
                        <p><i class="fa-solid fa-circle-check" style="color: var(--pink-dark);"></i> All course materials, code snippets, and laboratory logs are updated continuously throughout the semester.</p>
                    </div>
                `;
            }

            modalBody.innerHTML = htmlContent;
            subpageModal.classList.add('active');
        }

        function closeSubPage() {
            subpageModal.classList.remove('active');
        }

        // Subnet Calculator Logic
        function calculateSubnet() {
            const ip = document.getElementById('calc-ip').value || '192.168.1.1';
            const prefix = document.getElementById('calc-prefix').value;
            const parts = ip.split('.');
            if (parts.length === 4) {
                const base = `${parts[0]}.${parts[1]}.${parts[2]}`;
                document.getElementById('calc-results').innerHTML = `
                    <strong>Network Address:</strong> ${base}.0<br>
                    <strong>CIDR Prefix:</strong> /${prefix}<br>
                    <strong>Host Range:</strong> ${base}.1 - ${base}.${254 - (prefix - 24) * 30}<br>
                    <strong>Broadcast Address:</strong> ${base}.255
                `;
            }
        }

        // Ping Simulator Logic
        function simulatePing() {
            const l1 = document.getElementById('ping-line');
            const l2 = document.getElementById('ping-line-2');
            const status = document.getElementById('ping-status');
            
            l1.style.background = 'var(--pink-accent)';
            status.innerText = "Sending ICMP Packet to Switch...";
            
            setTimeout(() => {
                l2.style.background = 'var(--pink-accent)';
                status.innerText = "Packet delivered to PC-02! Reply 64 bytes time=2ms TTL=64";
            }, 600);

            setTimeout(() => {
                l1.style.background = '#ccc';
                l2.style.background = '#ccc';
            }, 2000);
        }

        // Temperature Gauge Logic
        function updateTempGauge(val) {
            document.getElementById('temp-val').innerText = val;
            document.getElementById('hum-val').innerText = Math.min(90, Math.max(30, 100 - val * 1.5));
            const statusEl = document.getElementById('temp-status');
            if (val > 32) {
                statusEl.innerText = "HIGH TEMP WARNING!";
                statusEl.style.color = "#ff3366";
            } else {
                statusEl.innerText = "NORMAL ROOM TEMP";
                statusEl.style.color = "#00ff66";
            }
        }

        // Servo Angle Logic
        function rotateServo(angle) {
            document.getElementById('servo-arm').style.transform = `rotate(${angle - 90}deg)`;
            document.getElementById('servo-angle-text').innerText = `${angle}°`;
        }

        // Calculator App Logic
        let calcVal = '0';
        function calcBtn(val) {
            const screen = document.getElementById('calc-screen');
            if (val === 'C') {
                calcVal = '0';
            } else if (val === '=') {
                try {
                    calcVal = eval(calcVal).toString();
                } catch {
                    calcVal = 'Error';
                }
            } else {
                if (calcVal === '0' || calcVal === 'Error') calcVal = '';
                calcVal += val;
            }
            screen.value = calcVal || '0';
        }

        const canvas = document.getElementById('lily-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class PinkWhiteLily {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 50;
                this.size = 14 + Math.random() * 16;
                this.speedY = 0.6 + Math.random() * 1.2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.opacity = 0.5 + Math.random() * 0.45;
                // STRICTLY PINK & WHITE PALETTE
                this.petalColor = Math.random() > 0.5 ? '#ffffff' : '#ff9fc5';
                this.centerColor = Math.random() > 0.5 ? '#ffd6e7' : '#ff69b4';
            }

            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.01) * 0.5;
                this.rotation += this.rotationSpeed;

                if (this.y < -40) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.petalColor;

                // Draw 5 Petals of Lily
                for (let i = 0; i < 5; i++) {
                    ctx.rotate((Math.PI * 2) / 5);
                    ctx.beginPath();
                    ctx.ellipse(0, this.size / 2, this.size / 4, this.size / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Flower Center Dot (Pink/White)
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 5, 0, Math.PI * 2);
                ctx.fillStyle = this.centerColor;
                ctx.fill();

                ctx.restore();
            }
        }

        const lilies = Array.from({ length: 24 }, () => new PinkWhiteLily());

        function animateLilies() {
            ctx.clearRect(0, 0, width, height);
            lilies.forEach(lily => {
                lily.update();
                lily.draw();
            });
            requestAnimationFrame(animateLilies);
        }

        animateLilies();
    </script>
</body>
</html>
